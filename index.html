<script type="module">
import * as THREE from 'three';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';
import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as RNS from 'rapier';
const RAPIER = RNS.default ?? RNS;

const PORTALS = [
  { id: 'pingpong', label: 'Ping pong dei vampiri', color: 0xb36bff },
  { id: 'basket', label: 'Tiri a canestro nel castello', color: 0xff8a1f },
  { id: 'calcio', label: 'Rigori contro gli zombie', color: 0x5dff7a },
  { id: 'climb', label: "Arrampicata della strega", color: 0xff4fd8 },
];

const rnd = (a, b) => a + Math.random() * (b - a);
const M = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.9, ...extra });

function labelTexture(text, color) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(10,4,20,0.8)'; g.fillRect(0, 0, 512, 128);
  g.strokeStyle = '#' + new THREE.Color(color).getHexString(); g.lineWidth = 6; g.strokeRect(3, 3, 506, 122);
  g.fillStyle = '#fff'; g.font = 'bold 34px system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const words = text.split(' '); const mid = Math.ceil(words.length / 2);
  g.fillText(words.slice(0, mid).join(' '), 256, 48); g.fillText(words.slice(mid).join(' '), 256, 88);
  return new THREE.CanvasTexture(c);
}

const portalMat = (color) => new THREE.ShaderMaterial({
  transparent: true, side: THREE.DoubleSide, depthWrite: false,
  uniforms: { uTime: { value: 0 }, uColor: { value: new THREE.Color(color) } },
  vertexShader: 'varying vec2 vUv; void main(){vUv=uv-0.5; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: `varying vec2 vUv; uniform float uTime; uniform vec3 uColor;
    void main(){ float r=length(vUv)*2.; float a=atan(vUv.y,vUv.x);
      float s=0.5+0.5*sin(a*3.+r*9.-uTime*2.5);
      gl_FragColor=vec4(uColor*(0.4+s*0.9), (1.-r)*0.85); }`,
});

function buildEnvironment(scene) {
  scene.background = new THREE.Color(0x120820);
  scene.fog = new THREE.FogExp2(0x1a0b2e, 0.022);

  // Luci (poche, per visori autonomi)
  scene.add(new THREE.HemisphereLight(0x8a6bff, 0x331a00, 0.7));
  const moonLight = new THREE.DirectionalLight(0xbcd0ff, 0.9); moonLight.position.set(-30, 40, -40); scene.add(moonLight);
  const torchA = new THREE.PointLight(0xff7a18, 40, 25); torchA.position.set(-6, 3, 4);
  const torchB = new THREE.PointLight(0xa044ff, 40, 25); torchB.position.set(6, 3, 4);
  scene.add(torchA, torchB);

  // Luna piena + alone + stelle
  const moon = new THREE.Mesh(new THREE.SphereGeometry(6, 24, 16), new THREE.MeshBasicMaterial({ color: 0xfff4d6, fog: false }));
  moon.position.set(-30, 38, -90);
  const halo = new THREE.Mesh(new THREE.SphereGeometry(9, 24, 16), new THREE.MeshBasicMaterial({ color: 0xfff0b0, transparent: true, opacity: 0.15, fog: false, depthWrite: false }));
  halo.position.copy(moon.position); scene.add(moon, halo);
  const sp = new Float32Array(900);
  for (let i = 0; i < 300; i++) { const u = rnd(0, Math.PI * 2), v = rnd(0.15, 1.3), R = 150; sp.set([R * Math.cos(u) * Math.cos(v), R * Math.sin(v), R * Math.sin(u) * Math.cos(v)], i * 3); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(sp, 3));
  scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ size: 0.8, color: 0xffffff, fog: false })));

  // Terreno e palestra (piattaforma circolare con pilastri e torce)
  const ground = new THREE.Mesh(new THREE.CircleGeometry(90, 48), M(0x1c1428)); ground.rotation.x = -Math.PI / 2; scene.add(ground);
  const floor = new THREE.Mesh(new THREE.CylinderGeometry(12, 12.5, 0.4, 48), M(0x3a2f4a, { roughness: 0.6 })); floor.position.y = -0.2; scene.add(floor);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(11, 0.08, 6, 64), new THREE.MeshBasicMaterial({ color: 0xff8a1f })); ring.rotation.x = Math.PI / 2; ring.position.y = 0.02; scene.add(ring);
  const pillarGeo = new THREE.CylinderGeometry(0.35, 0.45, 3.5, 8), flameGeo = new THREE.SphereGeometry(0.22, 8, 6);
  const flameMat = new THREE.MeshBasicMaterial({ color: 0xffa030 }); const stone = M(0x2a2236);
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2, x = Math.cos(a) * 12, z = Math.sin(a) * 12;
    const p = new THREE.Mesh(pillarGeo, stone); p.position.set(x, 1.75, z);
    const f = new THREE.Mesh(flameGeo, flameMat); f.position.set(x, 3.8, z); scene.add(p, f);
  }

  // Castello gotico
  const castle = new THREE.Group(); castle.position.set(0, 0, -50);
  const wall = M(0x2b2238), roof = M(0x4a1d6b), winMat = new THREE.MeshBasicMaterial({ color: 0xff9a2e });
  const keep = new THREE.Mesh(new THREE.BoxGeometry(16, 20, 12), wall); keep.position.y = 10; castle.add(keep);
  const towerGeo = new THREE.CylinderGeometry(2.6, 3, 28, 10), coneGeo = new THREE.ConeGeometry(3.4, 8, 10);
  [[-11, -4], [11, -4], [-11, 4], [11, 4]].forEach(([x, z], i) => {
    const h = i < 2 ? 1 : 0.8;
    const t = new THREE.Mesh(towerGeo, wall); t.scale.y = h; t.position.set(x, 14 * h, z);
    const c = new THREE.Mesh(coneGeo, roof); c.position.set(x, 28 * h + 4, z); castle.add(t, c);
  });
  const merlon = new THREE.InstancedMesh(new THREE.BoxGeometry(1.2, 1.4, 1.2), wall, 14); const m4 = new THREE.Matrix4();
  for (let i = 0; i < 14; i++) { m4.setPosition(-7.5 + i * 1.15, 20.7, 6); merlon.setMatrixAt(i, m4); } castle.add(merlon);
  const win = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 2.2), winMat, 10);
  for (let i = 0; i < 10; i++) { m4.setPosition(-6 + (i % 5) * 3, 8 + Math.floor(i / 5) * 6, 6.05); win.setMatrixAt(i, m4); } castle.add(win);
  scene.add(castle);

  // Zucche luminose (istanziate)
  const pumpGeo = new THREE.SphereGeometry(0.5, 12, 8); pumpGeo.scale(1, 0.8, 1);
  const pumps = new THREE.InstancedMesh(pumpGeo, new THREE.MeshStandardMaterial({ color: 0xff6a00, emissive: 0xff5500, emissiveIntensity: 0.9 }), 45);
  const q = new THREE.Quaternion(), sc = new THREE.Vector3(), pos = new THREE.Vector3();
  for (let i = 0; i < 45; i++) {
    const a = rnd(0, Math.PI * 2), r = rnd(13.5, 40), s = rnd(0.6, 1.8);
    pos.set(Math.cos(a) * r, 0.4 * s, Math.sin(a) * r - (r > 25 ? 0 : 0)); q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd(0, 6));
    sc.set(s, s, s); pumps.setMatrixAt(i, m4.compose(pos, q, sc));
  } scene.add(pumps);

  // Alberi spettrali (tronchi + rami in una sola InstancedMesh)
  const branchGeo = new THREE.CylinderGeometry(0.06, 0.25, 1, 6); branchGeo.translate(0, 0.5, 0);
  const trees = new THREE.InstancedMesh(branchGeo, M(0x120d18), 25 * 5); let n = 0; const e = new THREE.Euler();
  for (let i = 0; i < 25; i++) {
    const a = rnd(0, Math.PI * 2), r = rnd(18, 55), x = Math.cos(a) * r, z = Math.sin(a) * r - 5, h = rnd(5, 9);
    trees.setMatrixAt(n++, m4.compose(pos.set(x, 0, z), q.identity(), sc.set(1.4, h, 1.4)));
    for (let b = 0; b < 4; b++) {
      e.set(rnd(0.6, 1.2), rnd(0, 6.28), rnd(-0.5, 0.5)); q.setFromEuler(e);
      trees.setMatrixAt(n++, m4.compose(pos.set(x, h * rnd(0.55, 0.9), z), q, sc.set(0.7, rnd(2, 3.5), 0.7)));
    }
  } scene.add(trees);

  // Pipistrelli (istanziati, ali animate con scala)
  const bg = new THREE.BufferGeometry();
  bg.setAttribute('position', new THREE.BufferAttribute(new Float32Array([-0.5,0,0, 0,0,0.15, -0.1,0,-0.3, 0.5,0,0, 0,0,0.15, 0.1,0,-0.3]), 3)); bg.computeVertexNormals();
  const bats = new THREE.InstancedMesh(bg, new THREE.MeshBasicMaterial({ color: 0x050308, side: THREE.DoubleSide }), 24);
  const batData = Array.from({ length: 24 }, () => ({ r: rnd(8, 30), y: rnd(5, 18), sp: rnd(0.2, 0.6), ph: rnd(0, 6.28) }));
  scene.add(bats);

  // Fantasmi (profilo Lathe, trasparenti)
  const prof = [[0,0],[0.5,0.1],[0.6,0.5],[0.55,1],[0.45,1.5],[0.2,1.9],[0,2]].map(([x,y]) => new THREE.Vector2(x, y));
  const ghostGeo = new THREE.LatheGeometry(prof, 14);
  const ghostMat = new THREE.MeshBasicMaterial({ color: 0xe8f0ff, transparent: true, opacity: 0.5 }), eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
  const eyeGeo = new THREE.SphereGeometry(0.07, 6, 6);
  const ghosts = Array.from({ length: 6 }, (_, i) => {
    const g = new THREE.Group(); g.add(new THREE.Mesh(ghostGeo, ghostMat));
    [-0.15, 0.15].forEach((x) => { const eye = new THREE.Mesh(eyeGeo, eyeMat); eye.position.set(x, 1.5, 0.4); g.add(eye); });
    g.userData = { r: rnd(14, 26), sp: rnd(0.1, 0.25), ph: i * 1.05 }; scene.add(g); return g;
  });

  // Portali interattivi
  const portals = PORTALS.map((p, i) => {
    const a = THREE.MathUtils.degToRad(-60 + i * 40), r = 9;
    const g = new THREE.Group(); g.position.set(Math.sin(a) * r, 0, -Math.cos(a) * r); g.lookAt(0, 0, 0);
    const frame = new THREE.Mesh(new THREE.TorusGeometry(1.5, 0.15, 8, 32), new THREE.MeshBasicMaterial({ color: p.color })); frame.position.y = 1.8;
    const disc = new THREE.Mesh(new THREE.CircleGeometry(1.5, 32), portalMat(p.color)); disc.position.y = 1.8; disc.userData.portalId = p.id;
    const label = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 0.6), new THREE.MeshBasicMaterial({ map: labelTexture(p.label, p.color), transparent: true })); label.position.y = 3.9;
    const base = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.4, 0.2, 16), M(p.color, { emissive: p.color, emissiveIntensity: 0.4 })); base.position.y = 0.1;
    g.add(frame, disc, label, base); scene.add(g); return { ...p, group: g, disc };
  });

  function update(t) {
    portals.forEach((p) => { p.disc.material.uniforms.uTime.value = t; p.group.position.y = 0.05 * Math.sin(t * 2 + p.color); });
    torchA.intensity = 36 + 6 * Math.sin(t * 9); torchB.intensity = 36 + 6 * Math.sin(t * 7 + 1);
    batData.forEach((b, i) => {
      const a = t * b.sp + b.ph, f = 0.5 + 0.5 * Math.sin(t * 14 + i);
      pos.set(Math.cos(a) * b.r, b.y + Math.sin(t + i) , Math.sin(a) * b.r - 10);
      q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), -a); bats.setMatrixAt(i, m4.compose(pos, q, sc.set(1.5, 1 + f * 3, 1.5)));
    }); bats.instanceMatrix.needsUpdate = true;
    ghosts.forEach((g) => { const a = t * g.userData.sp + g.userData.ph; g.position.set(Math.cos(a) * g.userData.r, 1.5 + Math.sin(t * 1.5 + a), Math.sin(a) * g.userData.r - 8); g.rotation.y = -a; });
  }
  return { portals, update };
}

// ===== BLOCCO 2: fisica Rapier, menu, HUD, ping pong =====
const $ = (id) => document.getElementById(id);
await RAPIER.init();
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); renderer.xr.enabled = true; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 250);
const rig = new THREE.Group(); rig.add(camera); scene.add(rig); camera.position.y = 1.6; rig.position.set(0, 0, 4);
const env = buildEnvironment(scene);

// ===== GRAFICA MIGLIORATA: texture procedurali, cielo, atmosfera (leggera, adatta ai visori) =====
const mkTex = (w, h, fn, rep) => { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); } return t; };
const speck = (g, w, h, n, a) => { for (let i = 0; i < n; i++) { g.fillStyle = Math.random() < 0.5 ? `rgba(0,0,0,${a})` : `rgba(255,255,255,${a * 0.6})`; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); } };
const glowTex = mkTex(64, 64, (g) => { const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.3, 'rgba(255,255,255,.35)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); });
const glow = (color, size, op = 0.8) => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false })); s.scale.setScalar(size); return s; };
const stoneTex = mkTex(512, 512, (g, w, h) => { for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { const v = 50 + Math.random() * 25; g.fillStyle = `rgb(${v + 12},${v},${v + 22})`; g.fillRect(x * 64, y * 64, 64, 64); }
  g.strokeStyle = '#120a1c'; g.lineWidth = 4; for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(i * 64, 0); g.lineTo(i * 64, h); g.moveTo(0, i * 64); g.lineTo(w, i * 64); g.stroke(); } speck(g, w, h, 3000, 0.25); }, [5, 5]);
const brickTex = mkTex(256, 256, (g, w, h) => { g.fillStyle = '#0c0714'; g.fillRect(0, 0, w, h); for (let r = 0; r < 8; r++) for (let c = -1; c < 4; c++) { const v = 90 + Math.random() * 60; g.fillStyle = `rgb(${v},${v - 8},${v + 14})`; g.fillRect(c * 64 + (r % 2) * 32 + 2, r * 32 + 2, 60, 28); } speck(g, w, h, 2500, 0.25); }, [3, 4]);
const moonTex = mkTex(256, 256, (g, w, h) => { g.fillStyle = '#fff4d6'; g.fillRect(0, 0, w, h); for (let i = 0; i < 40; i++) { g.fillStyle = `rgba(150,135,110,${0.15 + Math.random() * 0.25})`; g.beginPath(); g.arc(Math.random() * w, Math.random() * h, 5 + Math.random() * 22, 0, 7); g.fill(); } });
const facePath = (g) => { g.beginPath(); g.moveTo(88, 40); g.lineTo(108, 62); g.lineTo(68, 62); g.closePath(); g.moveTo(168, 40); g.lineTo(188, 62); g.lineTo(148, 62); g.closePath();
  g.moveTo(80, 80); g.quadraticCurveTo(128, 124, 176, 80); g.lineTo(160, 78); g.lineTo(144, 90); g.lineTo(128, 80); g.lineTo(112, 90); g.lineTo(96, 78); g.closePath(); };
const pumpMat = new THREE.MeshStandardMaterial({ roughness: 0.6, emissive: 0xffffff, emissiveIntensity: 1.5,
  map: mkTex(256, 128, (g, w, h) => { g.fillStyle = '#ff7a10'; g.fillRect(0, 0, w, h); for (let i = 0; i < 8; i++) { g.fillStyle = 'rgba(120,40,0,.4)'; g.fillRect(i * 32 - 2, 0, 5, h); } g.fillStyle = '#301000'; facePath(g); g.fill(); }),
  emissiveMap: mkTex(256, 128, (g, w, h) => { g.fillStyle = '#3a1200'; g.fillRect(0, 0, w, h); g.fillStyle = '#ffd060'; facePath(g); g.fill(); }) });
function sky() { const s = new THREE.Mesh(new THREE.SphereGeometry(200, 24, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: 'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: 'varying float h;void main(){vec3 top=vec3(.02,.01,.06),mid=vec3(.22,.08,.32),hor=vec3(.95,.38,.1);float t=clamp(h,0.,1.);vec3 c=mix(hor,mid,smoothstep(0.,.18,t));c=mix(c,top,smoothstep(.15,.8,t));gl_FragColor=vec4(c,1.);}' })); s.renderOrder = -1; return s; }
function enhance(scene, env) {
  scene.fog.color.set(0x341450); scene.add(sky());
  const flames = []; let pumps = null;
  scene.traverse((o) => { const t = o.geometry && o.geometry.type, p = (o.geometry && o.geometry.parameters) || {};
    if (t === 'CircleGeometry' && p.radius === 90) o.material = new THREE.MeshStandardMaterial({ roughness: 1, map: mkTex(256, 256, (g, w, h) => { g.fillStyle = '#1d1230'; g.fillRect(0, 0, w, h); speck(g, w, h, 5000, 0.3); }, [40, 40]) });
    else if (t === 'CylinderGeometry' && p.radiusTop === 12) o.material = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.55, metalness: 0.1 });
    else if (t === 'SphereGeometry' && p.radius === 6) { o.material.map = moonTex; o.material.color.set(0xffffff); o.material.needsUpdate = true; }
    else if (t === 'BoxGeometry' && p.width === 16 && p.height === 20) { o.material.map = brickTex; o.material.color.set(0xc8b8d8); o.material.needsUpdate = true; }
    else if (o.isInstancedMesh && t === 'SphereGeometry' && o.count === 45) { o.material = pumpMat; pumps = o; }
    else if (t === 'SphereGeometry' && p.radius === 0.22) flames.push(o); });
  flames.forEach((f) => { const s = glow(0xff8a20, 1.8); s.position.copy(f.position); scene.add(s); });
  if (pumps) { const sg = new THREE.CylinderGeometry(0.05, 0.07, 0.18, 6); sg.translate(0, 0.42, 0); const st = new THREE.InstancedMesh(sg, new THREE.MeshStandardMaterial({ color: 0x3a5a1a }), 45); const m4 = new THREE.Matrix4();
    for (let i = 0; i < 45; i++) { pumps.getMatrixAt(i, m4); st.setMatrixAt(i, m4); } scene.add(st); }
  const fogTex = mkTex(256, 256, (g) => { for (let i = 0; i < 40; i++) { const x = Math.random() * 256, y = Math.random() * 256, r = 30 + Math.random() * 50, gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, 'rgba(200,170,255,.22)'); gr.addColorStop(1, 'rgba(200,170,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); } });
  const layers = [0.3, 0.9].map((y, i) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshBasicMaterial({ map: fogTex, transparent: true, depthWrite: false, opacity: 0.7 - 0.2 * i })); m.rotation.x = -Math.PI / 2; m.position.y = y; scene.add(m); return m; });
  const N = 150, ep = new Float32Array(N * 3), ph = Array.from({ length: N }, () => [Math.random(), 0.15 + Math.random() * 0.25, (Math.random() - 0.5) * 60, (Math.random() - 0.5) * 55 - 10]);
  const eg = new THREE.BufferGeometry(); eg.setAttribute('position', new THREE.BufferAttribute(ep, 3));

    if (hv !== G.hover) { if (G.hover) G.hover.mesh.material.emissiveIntensity = 0.5; if (hv) hv.mesh.material.emissiveIntensity = 1.8; G.hover = hv; }
  }
  const hy = camera.getWorldPosition(tmp).y - 1.6; if (hy > G.best) G.best = hy;
  ui3d.position.y = rig.position.y;
  if (Math.ceil(G.time) !== G.lastSec || Math.abs(G.best - G.shownBest) >= 0.1) { G.lastSec = Math.ceil(G.time); G.shownBest = G.best; drawPanel(); }
  G.hintT -= dt; if (G.hintT <= 0) { G.hintT = 0.3; $('hint').textContent = `Altezza ${G.best.toFixed(1)} m · ${Math.ceil(G.time)}s · ` + (vr ? 'Afferra gli appigli (grilletto, tasto laterale o pizzico) e tirati su con le braccia · viola = si rompe' : 'Click sugli appigli vicini · viola = si rompe dopo 2,5 s · arriva all\'appiglio dorato'); }

function finishClimb(win) {

  ctrls.forEach((c) => (c.userData.hold = null));
  panel.draw([win ? 'SEI IN CIMA! 🧙' : 'TEMPO SCADUTO!', `Altezza: ${G.best.toFixed(1)} m`, `Record: ${r.best} m`], 40);
  $('eT').textContent = win ? 'Hai raggiunto la cima!' : 'Tempo scaduto!'; $('eP').textContent = `Altezza: ${G.best.toFixed(1)} m · record ${r.best} m`; $('eTip').textContent = TIPS.climb; $('end').style.display = 'flex';
}

// ---- Input desktop ----
let yaw = 0, pitch = 0, drag = false, moved = false; const keys = {};
const cv = renderer.domElement;
cv.addEventListener('pointerdown', (e) => { drag = true; moved = false; bbClick(e); calcioClick(e); climbClick(e); });
addEventListener('pointerup', (e) => { drag = false; if (!moved && e.target === cv) { const v = new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(v, camera); pick(ray.ray.origin, ray.ray.direction); } });
addEventListener('pointermove', (e) => {
  if (mode === 'game' && G && !renderer.xr.isPresenting) G.mouse.set(((e.clientX / innerWidth) * 2 - 1) * 0.9, 0.75 + (1 - e.clientY / innerHeight) * 0.9, -1.0);
  if (drag && mode === 'menu') { moved = true; yaw -= e.movementX * 0.004; pitch = cl(pitch - e.movementY * 0.004, -1.2, 1.2); } });
addEventListener('keydown', (e) => { keys[e.code] = true; if (e.code === 'KeyP') togglePause(); }); addEventListener('keyup', (e) => (keys[e.code] = false));
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); });
$('bMenu').onclick = toMenu; $('bPause').onclick = togglePause; $('eMenu').onclick = toMenu; $('eAgain').onclick = () => start(G.id);
$('bScores').onclick = () => { const s = store.get(), r = s.pingpong; const bb = s.basket, cc = s.calcio, cb = s.climb; say([cb && `Arrampicata: record ${cb.best} m`, cc && `Rigori: record ${cc.best} gol su 5`, r && `Ping pong: ${r.wins} vittorie su ${r.played} partite · miglior scarto +${r.best}`, bb && `Basket: record ${bb.best} punti`].filter(Boolean).join(' | ') || 'Nessun punteggio ancora: gioca una partita!'); };

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (renderer.xr.isPresenting) trackHands(dt);
  if (!renderer.xr.isPresenting && mode === 'menu') { rig.rotation.y = yaw; camera.rotation.x = pitch;
    rig.translateZ(-((keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0)) * 3 * dt); rig.translateX(((keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0)) * 3 * dt); }
  if (mode === 'game' && G && !paused && !G.over) (G.id === 'basket' ? bbUpdate(dt) : G.id === 'calcio' ? calcioUpdate(dt) : G.id === 'climb' ? climbUpdate(dt) : ppUpdate(dt));

  if (renderer.xr.isPresenting) renderer.render(scene, camera); else composer.render();

toMenu();
